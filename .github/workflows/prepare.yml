name: Prepare isolated CodeQL case branches

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout builder inputs
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Prepare fixed case branches
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash .malpr-builder/prepare.sh

